[project]
name = "compress-picture-to70"
version = "8.10.0"
description = "批量圖片壓縮工具，支援並行處理與 EXIF 保留"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.0.0",
    "rich>=13.0.0",
    "pillow-heif>=0.14.0",
]

[project.scripts]
compress-img = "compress_images:main"
compress-images = "compress_images:main"
images-to-webp = "images_to_webp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "compress_images.py",
    "images_to_webp.py",
    "utils.py",
    "ui.py",
    "cli.py",
    "image_core.py",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
